<!DOCTYPE html>
<html>

<head>

    <title>My Weather App</title>

    <link rel="stylesheet" href="WEATHER_FORECAST.css">

</head>

<body>

    <h1>My Weather App</h1>

    <h2>Today's Weather</h2>

    <div class="weather">

        <h2>Nairobi, Kenya</h2>

        <p>Sunday, September 6, 2026</p>

        <h3>24°C</h3>

        <p>Partly Cloudy ☀️</p>

        <div class="sun">☀️</div>

    </div>


    <h2>Weekly Forecast</h2>


    <div class="forecast">

        <div class="day">

            <h3>Monday</h3>

            <p>☀️</p>

            <h3>26°C</h3>

        </div>


        <div class="day">

            <h3>Tuesday</h3>

            <p>🌤️</p>

            <h3>25°C</h3>

        </div>


        <div class="day">

            <h3>Wednesday</h3>

            <p>🌧️</p>

            <h3>22°C</h3>

        </div>


        <div class="day">

            <h3>Thursday</h3>

            <p>⛅</p>

            <h3>24°C</h3>

        </div>


        <div class="day">

            <h3>Friday</h3>

            <p>☀️</p>

            <h3>27°C</h3>

        </div>

    </div>


</body>

</html>
